<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A2219">
<title>Offline · Props &amp; Costume Inventory</title>
<style>
  /* Self-contained on purpose: this is what shows when nothing else can load,
     so it can't depend on the app's stylesheet or fonts arriving. */
  :root { --bg:#FBF7EC; --surface:#E8DFC9; --ink:#2A2219; --muted:#6B5F4C; --rule:#C9BC9C; --accent:#3F6B52; --honey:#C98A2C; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; }
  main { max-width: 26rem; background:var(--surface); border:1px solid var(--rule); border-radius:12px; padding:24px; }
  .hex { width:28px; aspect-ratio: 2 / 1.7320508; background:var(--honey);
         clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); }
  h1 { font: 600 1.4rem/1.2 Georgia, "Times New Roman", serif; margin: 14px 0 8px; }
  p { margin: 0 0 12px; color: var(--muted); }
  p strong { color: var(--ink); font-weight: 600; }
  button { margin-top: 8px; min-height: 44px; padding: 10px 18px; border: 0; border-radius: 8px; background: var(--accent);
           color: var(--bg); font: 500 15px/1 system-ui, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<main>
  <div class="hex" aria-hidden="true"></div>
  <h1>No signal here</h1>
  <p>This page hasn’t been opened on this device before, so there’s no copy of it to show offline.</p>
  <p><strong>Pages you’ve already opened still work</strong> — a production’s checklist included, and ticks you make there are sent once you’re back online.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
